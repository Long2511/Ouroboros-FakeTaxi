<!DOCTYPE html>
<html>
<head>
    <title>Azure Maps</title>
    <script src='https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.js'></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #myMap {
            position: absolute;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="myMap"></div>
    <script>
fetch('http://localhost:3000/mapskey')
    .then(response => response.json())
    .then(data => {
        var map = new atlas.Map('myMap', {
            center: [10.81586, 106.73341],
            zoom: 12,
                    authOptions: {
                        authType: 'subscriptionKey',
                        subscriptionKey: data.key
                    },
                    showLogo: false,
                    style: 'grayscale_dark'
                });

                // Add zoom control
                map.controls.add(new atlas.control.ZoomControl(), {
                    position: 'top-right'
                });

                // Add pitch control
                map.controls.add(new atlas.control.PitchControl(), {
                    position: 'top-right'
                });

                // Add compass control
                map.controls.add(new atlas.control.CompassControl(), {
                    position: 'top-right'
                });

                // Add scale bar control
                map.controls.add(new atlas.control.ScaleBarControl(), {
                    position: 'bottom-left'
                });

                // Add search box control
                var searchBox = new atlas.control.SearchBoxControl();
                map.controls.add(searchBox, {
                    position: 'top-left'
                });
        console.log(data.key);

        var marker = new atlas.HtmlMarker({
            position: [106.660172, 10.762622],
            htmlContent: '<div style="color:red;">My Marker</div>'
        });

        map.markers.add(marker);

        setInterval(function () {
            fetch('http://localhost:5000/gps')
                .then(response => response.json())
                .then(data => {
                    marker.setOptions({
                        position: [data.longitude, data.latitude]
                    });
                });
        }, 1000);
    });
    </script>
</body>
</html>
